<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./src/assets/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Education - Empower Your Learning</title>


    <!-- Dynamic Bootstrap CSS Loading -->
    <script>
      (function () {
        // Function to load Bootstrap CSS
        function loadBootstrapCSS(isRTL) {
          const existingLink = document.getElementById("bootstrap-css");
          if (existingLink) {
            existingLink.remove();
          }

          const link = document.createElement("link");
          link.id = "bootstrap-css";
          link.rel = "stylesheet";

           if (isRTL) {
             link.href =
               "https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.rtl.min.css";
           } else {
             link.href =
               "https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css";
           }

          link.crossOrigin = "anonymous";
          
          // Add error handling
          link.onerror = () => {
            console.error(`Failed to load Bootstrap CSS: ${link.href}`);
          };
          
          link.onload = () => {
            console.log(`Bootstrap CSS loaded successfully: ${link.href}`);
          };
          
          document.head.appendChild(link);
        }

        // Check localStorage and load appropriate Bootstrap CSS
        const savedLanguage = localStorage.getItem("language");
        const isRTL = savedLanguage === "ar";
        loadBootstrapCSS(isRTL);

        // Make the function globally available for dynamic switching
        window.loadBootstrapCSS = loadBootstrapCSS;
      })();
    </script>

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
    />
    <!-- Arabic Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@200;300;400;500;600;700;800;900&family=Tajawal:wght@200;300;400;500;700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
